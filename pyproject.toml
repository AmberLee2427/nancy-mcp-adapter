[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "nancy-nancy-mcp-adapter"
version = "0.1.0"
description = "A Nexus-Nancy plugin to support MCP use"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Amber Malpas", email = "malpas.1@osu.edu" }
]
dependencies = ["nexus-nancy>=1.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]

[project.entry-points."nexus_nancy.plugins"]
nancy-mcp-adapter = "nancy_nancy-mcp-adapter.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/nancy_nancy-mcp-adapter"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]